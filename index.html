<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2e7bff">
    <meta name="robots" content="noindex">
    <title>OOC Circle - Sedang Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-deco" aria-hidden="true">
        <div class="burst b1"></div>
        <div class="burst b2"></div>
    </div>

    <main class="card maintenance-card">
        <span class="sticker">Sedang Maintenance</span>

        <div class="gears" aria-hidden="true">
            <svg class="gear big" viewBox="0 0 100 100">
                <g fill="#2e7bff" stroke="#0d1b3d" stroke-width="4" stroke-linejoin="round">
                    <rect x="42" y="2" width="16" height="22" rx="3"/>
                    <rect x="42" y="2" width="16" height="22" rx="3" transform="rotate(45 50 50)"/>
                    <rect x="42" y="2" width="16" height="22" rx="3" transform="rotate(90 50 50)"/>
                    <rect x="42" y="2" width="16" height="22" rx="3" transform="rotate(135 50 50)"/>
                    <rect x="42" y="2" width="16" height="22" rx="3" transform="rotate(180 50 50)"/>
                    <rect x="42" y="2" width="16" height="22" rx="3" transform="rotate(225 50 50)"/>
                    <rect x="42" y="2" width="16" height="22" rx="3" transform="rotate(270 50 50)"/>
                    <rect x="42" y="2" width="16" height="22" rx="3" transform="rotate(315 50 50)"/>
                    <circle cx="50" cy="50" r="32"/>
                </g>
                <circle cx="50" cy="50" r="13" fill="#eaf5ff" stroke="#0d1b3d" stroke-width="4"/>
            </svg>
            <svg class="gear small" viewBox="0 0 100 100">
                <g fill="#ffd84a" stroke="#0d1b3d" stroke-width="5" stroke-linejoin="round">
                    <rect x="41" y="2" width="18" height="24" rx="3"/>
                    <rect x="41" y="2" width="18" height="24" rx="3" transform="rotate(60 50 50)"/>
                    <rect x="41" y="2" width="18" height="24" rx="3" transform="rotate(120 50 50)"/>
                    <rect x="41" y="2" width="18" height="24" rx="3" transform="rotate(180 50 50)"/>
                    <rect x="41" y="2" width="18" height="24" rx="3" transform="rotate(240 50 50)"/>
                    <rect x="41" y="2" width="18" height="24" rx="3" transform="rotate(300 50 50)"/>
                    <circle cx="50" cy="50" r="32"/>
                </g>
                <circle cx="50" cy="50" r="12" fill="#eaf5ff" stroke="#0d1b3d" stroke-width="5"/>
            </svg>
        </div>

        <h1>SEDANG DALAM MAINTANCE!</h1>

        <p class="msg">Web OOC Circle sedang diperbarui supaya makin kece. Sebentar lagi kami balik.</p>
        <p class="sub">Halaman ini otomatis pindah ke web saat perbaikan selesai.</p>

        <button class="btn btn-primary btn-block" id="retry" type="button">CEK LAGI</button>
        <p class="status" id="status" role="status"></p>

        <p class="foot">&copy; 2026 OOC Circle Official</p>
    </main>

    <script>
        const btn = document.getElementById('retry');
        const statusEl = document.getElementById('status');

        async function stillDown() {
            try {
                const r = await fetch('/', { redirect: 'manual', cache: 'no-store' });
                return r.type === 'opaqueredirect' || !r.ok;
            } catch (e) {
                return true;
            }
        }

        async function check(manual) {
            if (manual) {
                btn.disabled = true;
                statusEl.textContent = 'Mengecek...';
            }
            const down = await stillDown();
            if (!down) {
                statusEl.textContent = 'Web sudah aktif! Membuka...';
                location.replace('/');
                return;
            }
            if (manual) {
                btn.disabled = false;
                statusEl.textContent = 'Masih dirapikan. Coba lagi sebentar lagi.';
            }
        }

        btn.addEventListener('click', () => check(true));
        setInterval(() => check(false), 20000);
    </script>
</body>
</html>
