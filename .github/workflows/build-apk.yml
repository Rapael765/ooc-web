name: Build APK
run-name: Build APK ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        type: string
      site_url:
        description: "Link website"
        required: true
        type: string
      icon_url:
        description: "Link foto ikon"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Bangun APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SITE_URL: ${{ inputs.site_url }}
          ICON_URL: ${{ inputs.icon_url }}
          JOB_ID: ${{ inputs.job_id }}
        run: bash apk-template/build.sh

      - name: Simpan APK ke Release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          gh release create "apk-$JOB_ID" apk-template/out/*.apk \
            --title "APK $JOB_ID" \
            --notes "Dibuat otomatis oleh tools Web to APK"

      - name: Hapus release lama (sisakan 20 terbaru)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' \
            | grep '^apk-' | tail -n +21 \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y || true
